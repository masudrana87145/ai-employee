# Test this revision, then deploy that same checkout to the Google Cloud VM.
# DEPLOY_SSH_KEY is a GitLab CI/CD variable. Do not store the key in the repository.

stages:
  - test
  - deploy

test_api:
  stage: test
  image: python:3.12
  script:
    - python -m pip install -e ".[dev]"
    - python -m compileall -q hello.py arith.py api.py country_zones.py country_time_api.py tests
    - ruff check hello.py arith.py api.py country_zones.py country_time_api.py tests
    - mypy
    - python -m unittest discover -s tests -v

deploy_vm:
  stage: deploy
  image: python:3.12-slim
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends openssh-client curl ca-certificates
  script:
    - |
      set -euo pipefail
      if [ -z "${DEPLOY_SSH_KEY:-}" ] || ! printf '%s' "$DEPLOY_SSH_KEY" | grep -q "OPENSSH PRIVATE KEY"; then
        echo "DEPLOY_SSH_KEY is missing or is not an OpenSSH private key."
        exit 1
      fi
      mkdir -p ~/.ssh
      printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
      sed -i '1s/^\xEF\xBB\xBF//' ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key
      ssh-keygen -lf ~/.ssh/deploy_key
      VM_HOST="${VM_HOST:-35.224.217.181}"
      VM_USER="${VM_USER:-masudrana87145}"
      SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
      tar -czf - --exclude .git --exclude .venv . | "${SSH[@]}" "$VM_USER@$VM_HOST" "mkdir -p /home/masudrana87145/ai-employee && tar -xzf - -C /home/masudrana87145/ai-employee"
      "${SSH[@]}" "$VM_USER@$VM_HOST" "bash -s" << 'EOF'
      set -euo pipefail
      cd /home/masudrana87145/ai-employee
      python3 -m venv .venv
      .venv/bin/pip install --upgrade pip
      .venv/bin/pip install -e .
      sed -i 's/\r$//' deploy/ai-employee-api.service deploy/country-time-api.service
      sudo -n cp deploy/ai-employee-api.service /etc/systemd/system/ai-employee-api.service
      sudo -n cp deploy/country-time-api.service /etc/systemd/system/country-time-api.service
      sudo -n systemctl daemon-reload
      sudo -n systemctl enable ai-employee-api.service country-time-api.service
      sudo -n systemctl restart ai-employee-api.service country-time-api.service
      sleep 2
      curl -fsS http://127.0.0.1:8001/health
      echo
      curl -fsS "http://127.0.0.1:8001/time?country=Japan"
      echo
      systemctl is-active country-time-api.service
      curl -fsS http://127.0.0.1:8000/health
      echo
      systemctl is-active ai-employee-api.service
      EOF
